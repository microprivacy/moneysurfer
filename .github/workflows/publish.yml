name: Publish
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # Staged, not published: the trust relationship allows staging only, and a
      # maintainer approves the version with 2FA afterwards. prepublishOnly builds
      # dist/; a tag checkout is a detached HEAD, which the branch check refuses.
      - name: Stage package
        run: pnpm stage publish --no-git-checks
