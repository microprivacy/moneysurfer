name: Publish
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # Trusted publishing wants npm 11.5.1+; the runner's Node 22 ships npm 10.
      - run: npm i -g npm@latest
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Publish package
        run: |
          pnpm build
          npm publish
