name: Publish
on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # jsr publish resolves bare specifiers from a hoisted node_modules.
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Publish package
        run: npx jsr publish
