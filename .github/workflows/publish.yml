name: Publish
on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # The runner ships Node, but not pnpm -- corepack enable is what puts the
      # version in packageManager on PATH.
      #
      # jsr publish runs deno with --unstable-byonm, so bare npm specifiers are
      # resolved from node_modules and it has to be there. Deno reads a hoisted
      # layout; pnpm's default symlinked one it may not follow.
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Publish package
        run: npx jsr publish
